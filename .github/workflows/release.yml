name: Release

# Builds the arm64 macOS .app and publishes it as a GitHub Release asset whenever
# a version tag like "v1.0.0" is pushed.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14 # Apple Silicon (arm64) runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          uname -m
          swift --version

      - name: Package release build
        run: ./scripts/package_release.sh "${GITHUB_REF_NAME}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          generate_release_notes: true
